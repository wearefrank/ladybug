spring.application.name=ladybug-otel-test-companion
# For now this app only sends HTTP requests and finishes afterwards. Change to servlet to have it listen to HTTP requests.
spring.main.web-application-type=none

# Port of ladybug-test-webapp or ladybug-spring-boot-test-webapp. The CI/CD workflows run these webapps on port 8090.
ladybug.otel.port=8090
# OTLP/HTTP endpoint of Ladybug. Both ladybug-test-webapp and ladybug-spring-boot-test-webapp serve it at
# /ladybug/api/v1/traces.
ladybug.otel.endpoint=http://localhost:${ladybug.otel.port}/ladybug/api/v1/traces
# http/protobuf or http/json
ladybug.otel.protocol=http/protobuf
# single-request: send the whole trace in one request
# hello-world-separate: first send the "Otel here, hello world!" span, then the other spans in a second request
ladybug.otel.batching=single-request
# Sent using Basic Authentication, unless the username is empty. POST /v1/traces requires role IbisWebService
# when security is enabled. When security is disabled the credentials are ignored by Ladybug.
ladybug.otel.username=IbisObserverWebService
ladybug.otel.password=IbisObserverWebService
ladybug.otel.timeout-seconds=30
