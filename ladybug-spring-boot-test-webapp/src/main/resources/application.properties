spring.application.name=ladybug-spring-boot
spring.main.allow-circular-references=true
# org.wearefrank.ladybug.Config always contributes default @Bean definitions (e.g. views, debugStorage,
# testStorage) that ladybugSpringBootWebapp.xml intentionally overrides, the same way XML overrides the
# Quarkus @DefaultBean defaults. Spring Boot disallows bean overriding by default, unlike the
# XmlWebApplicationContext used by ladybug-test-webapp.
spring.main.allow-bean-definition-overriding=true
server.port=80
spring.mvc.view.prefix=/index
spring.mvc.view.suffix=.jsp
server.servlet.context-path=/
spring.mvc.servlet.path=/ladybug/api/
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
