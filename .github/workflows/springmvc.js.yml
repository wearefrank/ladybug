name: Testing ladybug-spring-boot-test-webapp
on:
  push:
    branches:
      - master
  pull_request:
  # Run daily on master to renew the Maven cache that pull requests use, like in jaxrs.js.yml (see
  # there). A scheduled run only runs job renew-caches, not the tests.
  schedule:
    - cron: "0 3 * * *"
jobs:
  # Fills the Maven cache in a single job, by doing what the tests do up to starting the server.
  # The caches of ladybug-frontend (pnpm store, Cypress binary) are renewed by jaxrs.js.yml.
  renew-caches:
    if: ${{ github.event_name == 'schedule' }}
    name: Renew caches
    runs-on: ubuntu-latest
    # Usually takes about 5 minutes. Stops a hanging job, instead of the default of 6 hours.
    timeout-minutes: 30
    steps:
      - name: Checkout ladybug
        uses: actions/checkout@v5
        with:
          repository: wearefrank/ladybug
          path: ladybug
      # Maven also builds ladybug-frontend, which needs pnpm. Must be the same Node.js version as
      # in job springmvc.
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install frontend dependencies with pnpm
        uses: ./ladybug/.github/actions/pnpm-install
        with:
          project-dir: ladybug/ladybug-frontend
      - name: Start ladybug-spring-boot-test-webapp
        uses: ./ladybug/.github/actions/start-ladybug-spring-boot-test-webapp
      - name: Collect failure data into a single artifact directory
        if: failure()
        run: bash ladybug/.github/workflows/springmvc/collect-failure-data.sh
      # Artifacts belong to a single workflow run and job springmvc never runs in the same run, so
      # this name cannot clash with the artifacts of job springmvc.
      - name: Store logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: springmvc logs renew-caches
          path: artifact-data/
          if-no-files-found: warn

  springmvc:
    if: ${{ github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            spring-profile: none
            selected-specs: cypress/e2e/no-profile/**
            uiTestMode: NO_AUTH
          - name: xmlStorage
            spring-profile: storage.xml
            selected-specs: cypress/e2e/storage-xml/**
            uiTestMode: NO_AUTH
          - name: authorization
            spring-profile: none
            selected-specs: cypress/e2e/production-auth/**
            uiTestMode: DEFAULT
            observerUsername: IbisObserver
            observerPassword: IbisObserver
            testerUsername: IbisTester
            testerPassword: IbisTester
          - name: authorizationObserverWebService
            spring-profile: none
            selected-specs: cypress/e2e/production-auth/**
            uiTestMode: DEFAULT
            observerUsername: IbisObserverWebService
            observerPassword: IbisObserverWebService
            testerUsername: IbisTester
            testerPassword: IbisTester
          - name: backendAuthorization
            spring-profile: none
            selected-specs: cypress/e2e/backend-auth/**
            uiTestMode: DONT_BLOCK_BACKEND
            observerUsername: IbisObserver
            observerPassword: IbisObserver
            testerUsername: IbisTester
            testerPassword: IbisTester
          - name: openTelemetry
            spring-profile: none
            selected-specs: cypress/e2e/open-telemetry/**
            uiTestMode: NO_AUTH
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Usually takes about 8 minutes. Stops a hanging job, instead of the default of 6 hours.
    timeout-minutes: 30

    steps:
      - name: Show chosen Spring profile for backend, chosen ladybug.ui.test.mode and chosen specs to run
        run: echo "Start backend with Spring profile ${{ matrix.spring-profile }}, ladybug.ui.test.mode=${{ matrix.uiTestMode }} and run specs ${{ matrix.selected-specs }}"
      - name: Checkout ladybug
        uses: actions/checkout@v5
        with:
          repository: wearefrank/ladybug
          path: ladybug

      # No "cache: pnpm" here. It would cache the pnpm store again, also for every branch.
      # Must be the same Node.js version as in job renew-caches.
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      # Caching is explained in the action.
      - name: Install frontend dependencies with pnpm
        uses: ./ladybug/.github/actions/pnpm-install
        with:
          project-dir: ladybug/ladybug-frontend

      - name: Set Cypress environment variables
        run: cp .github/workflows/cypress.env.json.cicd ladybug-frontend/cypress.env.json
        working-directory: ladybug

      # Also saves the Maven cache on master. See the action.
      - name: Start ladybug-spring-boot-test-webapp
        uses: ./ladybug/.github/actions/start-ladybug-spring-boot-test-webapp
        with:
          spring-profile: ${{ matrix.spring-profile }}
          ui-test-mode: ${{ matrix.uiTestMode }}

      - name: Run cypress with chrome browser
        uses: cypress-io/github-action@v7.4.3
        with:
          working-directory: ladybug/ladybug-frontend
          # Dependencies are installed above. Installing here would also make this action
          # save its own caches for every branch.
          install: false
          spec: ${{ matrix.selected-specs }}
          config: baseUrl=http://localhost:8090/ladybug
          browser: chrome
        env:
          CYPRESS_observerUsername: ${{ matrix.observerUsername }}
          CYPRESS_observerPassword: ${{ matrix.observerPassword }}
          CYPRESS_testerUsername: ${{ matrix.testerUsername }}
          CYPRESS_testerPassword: ${{ matrix.testerPassword }}

      - name: Show which users were actually authenticated, as logged in ladybug.log
        if: always() && matrix.observerUsername != ''
        run: bash ladybug/.github/workflows/show-authenticated-users.sh ladybug/ladybug-spring-boot-test-webapp/data/ladybug.log

      - name: Collect failure data into a single artifact directory
        if: failure()
        run: bash ladybug/.github/workflows/springmvc/collect-failure-data.sh

      - name: Store logs
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: springmvc logs and videos ${{ matrix.name }}
          path: artifact-data/
          if-no-files-found: warn
