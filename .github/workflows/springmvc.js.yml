name: Testing ladybug-spring-boot-test-webapp
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  springmvc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            spring-profile: none
            selected-specs: cypress/e2e/no-profile/**
            uiTestMode: NO_AUTH
          - name: xmlStorage
            spring-profile: storage.xml
            selected-specs: cypress/e2e/storage-xml/**
            uiTestMode: NO_AUTH
          - name: authorization
            spring-profile: none
            selected-specs: cypress/e2e/production-auth/**
            uiTestMode: DEFAULT
            observerUsername: IbisObserver
            observerPassword: IbisObserver
            testerUsername: IbisTester
            testerPassword: IbisTester
          - name: authorizationObserverWebService
            spring-profile: none
            selected-specs: cypress/e2e/production-auth/**
            uiTestMode: DEFAULT
            observerUsername: IbisObserverWebService
            observerPassword: IbisObserverWebService
            testerUsername: IbisTester
            testerPassword: IbisTester
          - name: backendAuthorization
            spring-profile: none
            selected-specs: cypress/e2e/backend-auth/**
            uiTestMode: DONT_BLOCK_BACKEND
            observerUsername: IbisObserver
            observerPassword: IbisObserver
            testerUsername: IbisTester
            testerPassword: IbisTester
          - name: openTelemetry
            spring-profile: none
            selected-specs: cypress/e2e/open-telemetry/**
            uiTestMode: NO_AUTH
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    steps:
      - name: Show chosen Spring profile for backend, chosen ladybug.ui.test.mode and chosen specs to run
        run: echo "Start backend with Spring profile ${{ matrix.spring-profile }}, ladybug.ui.test.mode=${{ matrix.uiTestMode }} and run specs ${{ matrix.selected-specs }}"
      - name: Checkout ladybug
        uses: actions/checkout@v5
        with:
          repository: wearefrank/ladybug
          path: ladybug

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          version: 9.4
          run_install: false
      - name: Get pnpm store directory
        id: store-path
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      # The pnpm store and the Cypress binary are cached in the same way as in jaxrs.js.yml.
      # See there for an explanation.
      - name: Restore pnpm store from cache
        id: restorePnpmStore
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.store-path.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-ladybug-frontend-${{ hashFiles('ladybug/ladybug-frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ github.ref != 'refs/heads/master' && format('{0}-pnpm-store-ladybug-frontend-', runner.os) || '' }}
      - name: Show pnpm version (before pnpm install)
        run: pnpm -v
      # No "cache: pnpm" here. It would cache the same pnpm store again, also for every branch.
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Get Cypress version
        id: cypressVersion
        working-directory: ladybug/ladybug-frontend
        run: echo "version=$(node -p "require('./package.json').devDependencies.cypress")" >> $GITHUB_OUTPUT
      - name: Restore Cypress binary from cache
        id: restoreCypress
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ steps.cypressVersion.outputs.version }}
      - name: Install frontend dependencies
        working-directory: ladybug/ladybug-frontend
        run: pnpm install --frozen-lockfile
      - name: Install Cypress binary if it is not there yet
        working-directory: ladybug/ladybug-frontend
        run: pnpm exec cypress install
      - name: Save pnpm store to cache
        if: ${{ github.ref == 'refs/heads/master' && steps.restorePnpmStore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.store-path.outputs.STORE_PATH }}
          key: ${{ steps.restorePnpmStore.outputs.cache-primary-key }}
      - name: Save Cypress binary to cache
        if: ${{ github.ref == 'refs/heads/master' && steps.restoreCypress.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/Cypress
          key: ${{ steps.restoreCypress.outputs.cache-primary-key }}

      - name: Set Cypress environment variables
        run: cp .github/workflows/cypress.env.json.cicd ladybug-frontend/cypress.env.json
        working-directory: ladybug

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build ladybug-spring-boot-test-webapp and the modules it depends on
        working-directory: ladybug
        run: mvn -B -pl ladybug-spring-boot-test-webapp -am install -DskipTests -Dmaven.javadoc.skip=true -Dmaven.skip.copyright=true

      - name: Show current time, allows you to check that logs are not old
        run: date

      - name: Start ladybug-spring-boot-test-webapp (default spring profile and uiTestMode)
        if: matrix.spring-profile == 'none' && matrix.uiTestMode == 'DEFAULT'
        working-directory: ladybug/ladybug-spring-boot-test-webapp
        run: mvn -B spring-boot:run -Dspring-boot.run.arguments="--server.port=8090" > serverStartLog.log 2>&1 &

      - name: Start ladybug-spring-boot-test-webapp (non-default spring profile or uiTestMode)
        if: matrix.spring-profile != 'none' || matrix.uiTestMode != 'DEFAULT'
        working-directory: ladybug/ladybug-spring-boot-test-webapp
        run: mvn -B spring-boot:run -Dspring-boot.run.arguments="--server.port=8090 --spring.profiles.active=${{ matrix.spring-profile }}" -Dspring-boot.run.jvmArguments="-Dladybug.ui.test.mode=${{ matrix.uiTestMode }}" > serverStartLog.log 2>&1 &

      - name: Wait for server to be available
        working-directory: ladybug/.github/workflows
        run: ./waitForUrl.sh http://localhost:8090 300

      - name: Run cypress with chrome browser
        uses: cypress-io/github-action@v7.4.3
        with:
          working-directory: ladybug/ladybug-frontend
          # Dependencies are installed above. Installing here would also make this action
          # save its own caches for every branch.
          install: false
          spec: ${{ matrix.selected-specs }}
          config: baseUrl=http://localhost:8090/ladybug
          browser: chrome
        env:
          CYPRESS_observerUsername: ${{ matrix.observerUsername }}
          CYPRESS_observerPassword: ${{ matrix.observerPassword }}
          CYPRESS_testerUsername: ${{ matrix.testerUsername }}
          CYPRESS_testerPassword: ${{ matrix.testerPassword }}

      - name: Show which users were actually authenticated, as logged in ladybug.log
        if: always() && matrix.observerUsername != ''
        run: bash ladybug/.github/workflows/show-authenticated-users.sh ladybug/ladybug-spring-boot-test-webapp/data/ladybug.log

      - name: Show files
        run: tree -d -L 5 .
        if: failure()

      - name: Collect failure data into a single artifact directory
        if: failure()
        run: |
          bash ladybug/.github/workflows/collect-artifact-data.sh artifact-data \
            "ladybug/ladybug-frontend/cypress/screenshots" \
            "ladybug/ladybug-frontend/cypress/videos" \
            "ladybug/ladybug-spring-boot-test-webapp/data/ladybug.log" \
            "ladybug/ladybug-frontend/cypress.env.json"

      - name: Store logs
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: springmvc logs and videos ${{ matrix.name }}
          path: artifact-data/
          if-no-files-found: warn
