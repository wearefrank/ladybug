name: Check ladybug-ff-test-webapp dependencies against Frank!Framework

# Fails when ladybug-ff-test-webapp gets a dependency version or scope that differs from what the
# Frank!Framework gives it outside the Ladybug project, unless the difference is listed in
# ladybug-ff-test-webapp/ff-dependency-check/allowed-differences.txt

on:
  push:
    branches: [ "master" ]
  pull_request:
  # Run daily on master to renew the Maven cache that pull requests use, like in jaxrs.js.yml (see
  # there). This workflow has a single job, so a scheduled run just runs it.
  schedule:
    - cron: "0 3 * * *"
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    # Maven also runs pnpm install for ladybug-frontend. Installing here first makes the pnpm
    # store and the Cypress binary come from the cache. Caching is explained in the action.
    - name: Install frontend dependencies with pnpm
      uses: ./.github/actions/pnpm-install
      with:
        project-dir: ladybug-frontend

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    # No "cache: maven" in the step above. That cache is saved on every branch and is never
    # updated. Caching is explained in the action. The cache is saved after the check, because
    # the check resolves the dependencies of the Frank!Framework, which mvn install does not.
    # It is saved also when the check fails, because a difference in dependencies is no
    # reason to download everything again. It is not saved when mvn install fails, because then
    # the cache would be incomplete for the rest of the month.
    - name: Restore Maven downloads from cache
      uses: ./.github/actions/maven-cache
      with:
        mode: restore
        name: ff-dependency-check
    - name: Install Ladybug artifacts in the local Maven repository
      id: install
      run: mvn -B install -DskipTests -Dmaven.skip.copyright=true
    - name: Check dependencies against Frank!Framework
      run: sh ladybug-ff-test-webapp/ff-dependency-check/check-ff-dependencies.sh
    - name: Save Maven downloads to cache
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      uses: ./.github/actions/maven-cache
      with:
        mode: save
