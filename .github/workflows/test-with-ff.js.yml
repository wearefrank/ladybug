# When maintaining this file, please have a fixed sequence
# of the keys within a step:
#   name, id, if, working-directory, run/uses, others.
# 
name: Test with FF!
on:
  push:
    branches:
      - master
  # Martijn would love to add "pull_request:" here, but that would take too many GitHub Actions minutes.
  # The tests need more than a quarter only to start the backend. This should not be done for
  # every tiny commit on a PR.
  workflow_dispatch:
    inputs:
      buildLatestFFandLadybugCode:
        description: If true, build code of frankframework and ladybug and start server from frank-runner/specials/ladybug
        type: boolean
        default: false
        required: true
      ffFork:
        description: If buildLatestFfandLadybugCode and if supplied, clone the Frank!Framework from this user or organization. Examples are "mhdirkse" or "jacodg".
        type: string
        required: false
      ffBranch:
        description: If buildLatestFfandLadybugCode and if supplied, check out this branch of Frank!Framework
        type: string
        required: false
jobs:
  testing:
    strategy:
      fail-fast: false
      matrix:
        test-app: ["false", "true"]
        storage: ["file", "database"]
        dtap: ["LOC", "PRD"]
        exclude:
          - dtap: "PRD"
            test-app: "true"
          - dtap: "PRD"
            storage: "database"
        include:
          - test-app: "false"
            configurations: configurationsDefault
          - test-app: "true"
            configurations: configurationsTestWebapp
          - dtap: "LOC"
            test-app: "false"
            specs: "cypress/e2e/cypress/common-over-test-envs/**,cypress/e2e/cypress/default/**"
          - dtap: "LOC"
            test-app: "true"
            specs: "cypress/e2e/cypress/common-over-test-envs/**,cypress/e2e/cypress/with-ladybug-ff-test-webapp/**"
          - dtap: "PRD"
            specs: "cypress/e2e/cypress/common-over-test-envs/**,cypress/e2e/cypress/prd/**"
          - storage: "file"
            debugStorageName: "FileDebugStorage"
          - storage: "database"
            debugStorageName: "DatabaseDebugStorage"
    name: test-app = ${{ matrix.test-app }}, Ladybug storage = ${{ matrix.storage }}, dtap.stage=${{ matrix.dtap }}
    runs-on: ubuntu-latest
    # Usually takes about 25 minutes, longer when building the code. Stops a hanging job, instead
    # of the default of 6 hours. Waiting for the server alone may take up to 30 minutes.
    timeout-minutes: 90
    steps:
      - name: Checkout ladybug
        uses: actions/checkout@v5
        with:
          repository: wearefrank/ladybug
          path: ladybug
      - name: Decide what to build and check the inputs
        id: decide
        run: bash ladybug/.github/workflows/with-ff/decide.sh
        env:
          BUILD_CODE_INPUT: ${{ inputs.buildLatestFFandLadybugCode }}
          FF_FORK: ${{ inputs.ffFork }}
          FF_BRANCH: ${{ inputs.ffBranch }}
          TEST_APP: ${{ matrix.test-app }}
      - name: Checkout Frank!Runner
        uses: actions/checkout@v5
        with:
          repository: wearefrank/frank-runner
          path: frank-runner
      - name: See commit number of checked-out frank-runner
        working-directory: frank-runner
        run: git log -1
      # Caching is explained in the action.
      - name: Restore Frank!Runner downloads from cache
        uses: ./ladybug/.github/actions/frank-runner-download-cache
        with:
          mode: restore
      # Without input ffBranch, ref is empty and the default branch is used.
      - name: Checkout frankframework
        if: ${{ steps.decide.outputs.buildCode == 'true' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.decide.outputs.ffRepository }}
          path: frankframework
          ref: ${{ inputs.ffBranch }}

      - name: Calculate paths
        run: bash ladybug/.github/workflows/with-ff/calculate-paths.sh
        env:
          BUILD_CODE: ${{ steps.decide.outputs.buildCode }}
          TEST_APP: ${{ matrix.test-app }}
      - name: Configure Frank!Runner and the Frank application
        run: bash ladybug/.github/workflows/with-ff/configure-frank-runner.sh
        env:
          DTAP: ${{ matrix.dtap }}
          STORAGE: ${{ matrix.storage }}
          CONFIGURATIONS: ${{ matrix.configurations }}

      # No "cache: pnpm" here. It would cache the pnpm store again, also for every branch.
      - name: Use Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
      - name: Show node version
        run: node -v
      # Caching is explained in the action.
      - name: Install packages with pnpm
        uses: ./ladybug/.github/actions/pnpm-install
        with:
          project-dir: ladybug/ladybug-ff-cypress-test
      - name: Show current time, allows you to check that logs are not old
        run: date
      - name: Let Frank!Runner do its downloads
        working-directory: ladybug/ladybug-ff-cypress-test
        run: pnpm run installFrankRunnerEnv
      # Frank!Runner builds with Maven if buildLatestFFandLadybugCode (frank-runner/specials/ladybug),
      # and always when it starts ladybug-ff-test-webapp (via its build.xml), because that has a
      # pom.xml and maven=true in frank-runner.properties. Starting ladybug-ff-test-webapp
      # resolves the full transitive dependency tree of the Frank!Framework. Without this cache,
      # every run re-downloads everything one small file at a time, which is slow and eats into
      # GitHub Actions' network throughput limits. Caching is explained in the action.
      - name: Restore Maven downloads from cache
        if: ${{ steps.decide.outputs.needsMaven == 'true' }}
        uses: ./ladybug/.github/actions/maven-cache
        with:
          mode: restore
          name: ${{ steps.decide.outputs.mavenCacheName }}
      - name: Prepare building the backend
        run: bash ladybug/.github/workflows/with-ff/prepare-backend.sh
        env:
          BUILD_CODE: ${{ steps.decide.outputs.buildCode }}
          TEST_APP: ${{ matrix.test-app }}
      - name: Start the backend
        run: bash ladybug/.github/workflows/with-ff/start-backend.sh
        env:
          BUILD_CODE: ${{ steps.decide.outputs.buildCode }}
          TEST_APP: ${{ matrix.test-app }}
      # Fails the job when the server is not healthy within 30 minutes. The health check of the
      # Frank!Framework is public (also when authentication is required) and returns 200 when all
      # configurations and adapters are running, and 503 when one of them is not.
      - name: Wait until server is healthy
        run: bash ladybug/.github/workflows/wait-for-server.sh http://localhost:8090/iaf/api/server/health 1800
      # Save the caches as soon as the server is up, so also when the tests fail. At that point
      # Frank!Runner and Maven have downloaded everything they need.
      - name: Save Frank!Runner downloads to cache
        uses: ./ladybug/.github/actions/frank-runner-download-cache
        with:
          mode: save
      - name: Save Maven downloads to cache
        if: ${{ steps.decide.outputs.needsMaven == 'true' }}
        uses: ./ladybug/.github/actions/maven-cache
        with:
          mode: save
      - name: Try to access server directly with curl
        run: curl -v -i --max-time 30 http://localhost:8090
      - name: Run the tests
        working-directory: ladybug/ladybug-ff-cypress-test
        run: bash ../.github/workflows/with-ff/run-tests.sh
        env:
          SPECS: ${{ matrix.specs }}
          DEBUG_STORAGE_NAME: ${{ matrix.debugStorageName }}
          STORAGE: ${{ matrix.storage }}
      - name: Collect failure data into a single artifact directory
        if: failure()
        run: bash ladybug/.github/workflows/with-ff/collect-failure-data.sh

      - name: Store logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-with-ff data test-app = ${{ matrix.test-app }} storage = ${{ matrix.storage }} dtap=${{ matrix.dtap }}
          path: artifact-data/
          if-no-files-found: warn
