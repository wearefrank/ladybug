name: Testing ladybug-test-webapp (jaxrs)
on:
  push:
    branches:
      - master
  pull_request:
env:
  # Paths of the cache of Frank!Runner downloads. Must be the same as in test-with-ff.js.yml,
  # because the cache is shared. The steps that restore and save this cache must use exactly
  # the same paths, otherwise the cache cannot be found. See test-with-ff.js.yml for details.
  FRANK_RUNNER_DOWNLOAD_CACHE_PATHS: |
    frank-runner/download
    !frank-runner/download/frankframework-webapp-*
    !frank-runner/download/metadata
    !frank-runner/download/frank-runner
jobs:
  jaxrs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            spring-profile: none
            selected-specs: cypress/e2e/no-profile/**
            authenticationTest: no-authentication
          - name: xmlStorage
            spring-profile: storage.xml
            selected-specs: cypress/e2e/storage-xml/**
            authenticationTest: no-authentication
          - name: authorization
            spring-profile: none
            selected-specs: cypress/e2e/production-auth/**
            authenticationTest: production
            observerUsername: IbisObserver
            observerPassword: IbisObserver
            testerUsername: IbisTester
            testerPassword: IbisTester
          - name: authorizationObserverWebService
            spring-profile: none
            selected-specs: cypress/e2e/production-auth/**
            authenticationTest: production
            observerUsername: IbisObserverWebService
            observerPassword: IbisObserverWebService
            testerUsername: IbisTester
            testerPassword: IbisTester
          - name: backendAuthorization
            spring-profile: none
            selected-specs: cypress/e2e/backend-auth/**
            authenticationTest: only-backend
            observerUsername: IbisObserver
            observerPassword: IbisObserver
            testerUsername: IbisTester
            testerPassword: IbisTester
          - name: openTelemetry
            spring-profile: none
            selected-specs: cypress/e2e/open-telemetry/**
            authenticationTest: no-authentication
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    steps:
      - name: Show chosen Spring profile for backend and chosen specs to run
        run: echo "Start backend with Spring profile ${{ matrix.spring-profile }} and run specs ${{ matrix.selected-specs }}"
      - name: Checkout ladybug
        uses: actions/checkout@v5
        with:
          repository: wearefrank/ladybug
          path: ladybug
      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          version: 9.4
          run_install: false
      - name: Get pnpm store directory
        id: store-path
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      # The pnpm store and the Cypress binary are cached in the same way in jaxrs.js.yml,
      # springmvc.js.yml and maven.yml (pnpm store only). The caches are only saved on master.
      # Branches and pull requests share the caches of master. See test-with-ff.js.yml.
      # The pnpm store is keyed on pnpm-lock.yaml. Only branches use restore-keys, to get most
      # packages from an older cache when pnpm-lock.yaml has changed. Master does not, so that
      # the caches it saves contain only what the current pnpm-lock.yaml needs.
      - name: Restore pnpm store from cache
        id: restorePnpmStore
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.store-path.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-ladybug-frontend-${{ hashFiles('ladybug/ladybug-frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ github.ref != 'refs/heads/master' && format('{0}-pnpm-store-ladybug-frontend-', runner.os) || '' }}
      - name: Show pnpm version (before pnpm install)
        run: pnpm -v
      # No "cache: pnpm" here. It would cache the same pnpm store again, also for every branch.
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      # The Cypress binary only depends on the version of Cypress, so that is the key.
      - name: Get Cypress version
        id: cypressVersion
        working-directory: ladybug/ladybug-frontend
        run: echo "version=$(node -p "require('./package.json').devDependencies.cypress")" >> $GITHUB_OUTPUT
      - name: Restore Cypress binary from cache
        id: restoreCypress
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ steps.cypressVersion.outputs.version }}
      - name: Install frontend dependencies
        working-directory: ladybug/ladybug-frontend
        run: pnpm install --frozen-lockfile
      - name: Install Cypress binary if it is not there yet
        working-directory: ladybug/ladybug-frontend
        run: pnpm exec cypress install
      - name: Save pnpm store to cache
        if: ${{ github.ref == 'refs/heads/master' && steps.restorePnpmStore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.store-path.outputs.STORE_PATH }}
          key: ${{ steps.restorePnpmStore.outputs.cache-primary-key }}
      - name: Save Cypress binary to cache
        if: ${{ github.ref == 'refs/heads/master' && steps.restoreCypress.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/Cypress
          key: ${{ steps.restoreCypress.outputs.cache-primary-key }}

      - name: Set Cypress environment variables
        run: cp .github/workflows/cypress.env.json.cicd ladybug-frontend/cypress.env.json
        working-directory: ladybug

      - name: Enable ladybug.ui.test.mode
        if: ${{ matrix.authenticationTest == 'only-backend' }}
        working-directory: ladybug
        run: cp .github/workflows/test-auth-only-backend.properties ladybug-test-webapp/src/main/resources/test.properties
      - name: Enable authentication - produce temp web.xml
        if: ${{ matrix.authenticationTest != 'no-authentication' }}
        working-directory: ladybug/ladybug-test-webapp/src/main/webapp/WEB-INF
        run: grep -v "CICD_AUTH" web.xml > web.xml.out
      - name: Enable authentication - copy temp web.xml back
        if: ${{ matrix.authenticationTest != 'no-authentication' }}
        working-directory: ladybug/ladybug-test-webapp/src/main/webapp/WEB-INF
        run: cp web.xml.out web.xml

      - name: Checkout frank-runner
        uses: actions/checkout@v5
        with:
          repository: wearefrank/frank-runner
          path: frank-runner
      - name: Set property to skip backend unit tests
        run: echo "maven.skip.tests=true" > frank-runner/specials/ladybug/build.properties
      - name: Set properties to skip backend Javadoc
        run: echo "maven.skip.javadoc=true" >> frank-runner/specials/ladybug/build.properties
      - name: Set property to skip checking licenses
        run: echo "maven.skip.copyright=true" >> frank-runner/specials/ladybug/build.properties
      - name: Choose Spring profile for backend if it is not "none"
        run: echo "spring.profiles.active=${{ matrix.spring-profile }}" >> frank-runner/specials/ladybug/build.properties
        if: ${{ matrix.spring-profile != 'none' }}
      - name: Set port where ladybug-test-webapp is served
        run: echo "tomcat.connector.port=8090" > frank-runner/build.properties
      - name: Prevent Java exception about binding port 443 (for https)
        run: echo "tomcat.secure.port=8443" >> frank-runner/build.properties
      - name: Make script executable that starts backend
        run: chmod a+x frank-runner/specials/ladybug/restart.sh

      # The key follows updates of Frank!Runner. See test-with-ff.js.yml for an explanation.
      - name: Restore Frank!Runner downloads from cache
        id: restoreFrankRunnerDownloads
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.FRANK_RUNNER_DOWNLOAD_CACHE_PATHS }}
          key: ${{ runner.os }}-frank-runner-download-${{ hashFiles('frank-runner/build.xml', 'frank-runner/env.sh') }}
      # The key changes every month, so that the cache is refreshed regularly and does not keep
      # collecting old versions of artifacts. There are no restore-keys for the same reason.
      # Caches of previous months are no longer used and GitHub deletes them after 7 days.
      - name: Determine current month for the key of the Maven cache
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> $GITHUB_OUTPUT
      - name: Restore Maven downloads from cache
        id: restoreMaven
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository/
          key: ${{ runner.os }}-maven-jaxrs-${{ steps.month.outputs.month }}
      - name: Show current time, allows you to check that logs are not old
        run: date

      - name: Let Frank!Runner do its downloads
        run: ./env.sh > installFrankRunnerEnv.log
        working-directory: frank-runner

      - name: Start server using Frank!Runner
        run: ./restart.sh
        working-directory: frank-runner/specials/ladybug
      - name: Wait for server to be available
        working-directory: ladybug/.github/workflows
        run: ./waitForUrl.sh http://localhost:8090 300
      # Save the caches as soon as the server is up, also when the tests fail. Only save on
      # master, so that all branches and pull requests share the caches of master.
      # See test-with-ff.js.yml for an explanation.
      - name: Save Frank!Runner downloads to cache
        if: ${{ github.ref == 'refs/heads/master' && steps.restoreFrankRunnerDownloads.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.FRANK_RUNNER_DOWNLOAD_CACHE_PATHS }}
          key: ${{ steps.restoreFrankRunnerDownloads.outputs.cache-primary-key }}
      - name: Save Maven downloads to cache
        if: ${{ github.ref == 'refs/heads/master' && steps.restoreMaven.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ~/.m2/repository/
          key: ${{ steps.restoreMaven.outputs.cache-primary-key }}
      - name: Run cypress with chrome browser
        uses: cypress-io/github-action@v7.4.3
        with:
          working-directory: ladybug/ladybug-frontend
          # Dependencies are installed above. Installing here would also make this action
          # save its own caches for every branch.
          install: false
          spec: ${{ matrix.selected-specs }}
          config: baseUrl=http://localhost:8090/ladybug
          browser: chrome
        env:
          CYPRESS_observerUsername: ${{ matrix.observerUsername }}
          CYPRESS_observerPassword: ${{ matrix.observerPassword }}
          CYPRESS_testerUsername: ${{ matrix.testerUsername }}
          CYPRESS_testerPassword: ${{ matrix.testerPassword }}

      - name: Show which users were actually authenticated, as logged in ladybug.log
        if: always() && matrix.observerUsername != ''
        run: bash ladybug/.github/workflows/show-authenticated-users.sh ladybug/ladybug-test-webapp/data/ladybug.log

      - name: Show files
        run: tree -d -L 5 .
        if: failure()

      - name: Collect failure data into a single artifact directory
        if: failure()
        run: |
          bash ladybug/.github/workflows/collect-artifact-data.sh artifact-data \
            "ladybug/ladybug-frontend/cypress/screenshots" \
            "ladybug/ladybug-frontend/cypress/videos" \
            "ladybug/ladybug-test-webapp/data/ladybug.log" \
            "ladybug/ladybug-frontend/cypress.env.json" \
            "ladybug/ladybug-test-webapp/src/main/resources/test.properties" \
            "ladybug/ladybug-test-webapp/src/main/webapp/WEB-INF/web.xml" \
            "frank-runner/specials/ladybug/build.properties" \
            "frank-runner/build.properties"

      - name: Store logs
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: jaxrs logs and videos ${{ matrix.name }}
          path: artifact-data/
          if-no-files-found: warn

