name: Testing ladybug-test-webapp (jaxrs)
on:
  push:
    branches:
      - master
  pull_request:
  # Run daily on master to renew the caches that pull requests use. Caches are only saved on
  # master (see .github/actions). Without this, pull requests miss the Frank!Runner download
  # cache after an update of Frank!Runner and the Maven cache at the start of a month, until
  # something is pushed to master. This also keeps the caches of master in use, so that GitHub
  # does not delete them after 7 days without use. Also renews the caches of ladybug-frontend
  # (pnpm store, Cypress binary) that springmvc.js.yml and maven.yml share. GitHub runs
  # scheduled workflows on the default branch only and may start them later than scheduled.
  # A scheduled run only runs job renew-caches, not the tests.
  schedule:
    - cron: "0 3 * * *"
jobs:
  # Fills the caches in a single job, by doing what the tests do up to starting the server.
  renew-caches:
    if: ${{ github.event_name == 'schedule' }}
    name: Renew caches
    runs-on: ubuntu-latest
    # Usually takes about 10 minutes. Stops a hanging job, instead of the default of 6 hours.
    timeout-minutes: 30
    steps:
      - name: Checkout ladybug
        uses: actions/checkout@v5
        with:
          repository: wearefrank/ladybug
          path: ladybug
      # Must be the same Node.js version as in job jaxrs.
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install frontend dependencies with pnpm
        uses: ./ladybug/.github/actions/pnpm-install
        with:
          project-dir: ladybug/ladybug-frontend
      - name: Start ladybug-test-webapp
        uses: ./ladybug/.github/actions/start-ladybug-test-webapp

      - name: Collect failure data into a single artifact directory
        if: failure()
        run: bash ladybug/.github/workflows/jaxrs/collect-failure-data.sh
      # Artifacts belong to a single workflow run and job jaxrs never runs in the same run, so
      # this name cannot clash with the artifacts of job jaxrs.
      - name: Store logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: jaxrs logs renew-caches
          path: artifact-data/
          if-no-files-found: warn

  jaxrs:
    if: ${{ github.event_name != 'schedule' }}
    # Usually takes about 10 minutes. Stops a hanging job, instead of the default of 6 hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            spring-profile: none
            selected-specs: cypress/e2e/no-profile/**
            authenticationTest: no-authentication
          - name: xmlStorage
            spring-profile: storage.xml
            selected-specs: cypress/e2e/storage-xml/**
            authenticationTest: no-authentication
          - name: authorization
            spring-profile: none
            selected-specs: cypress/e2e/production-auth/**
            authenticationTest: production
            observerUsername: IbisObserver
            observerPassword: IbisObserver
            testerUsername: IbisTester
            testerPassword: IbisTester
          - name: authorizationObserverWebService
            spring-profile: none
            selected-specs: cypress/e2e/production-auth/**
            authenticationTest: production
            observerUsername: IbisObserverWebService
            observerPassword: IbisObserverWebService
            testerUsername: IbisTester
            testerPassword: IbisTester
          - name: backendAuthorization
            spring-profile: none
            selected-specs: cypress/e2e/backend-auth/**
            authenticationTest: only-backend
            observerUsername: IbisObserver
            observerPassword: IbisObserver
            testerUsername: IbisTester
            testerPassword: IbisTester
          - name: openTelemetry
            spring-profile: none
            selected-specs: cypress/e2e/open-telemetry/**
            authenticationTest: no-authentication
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    steps:
      - name: Show chosen Spring profile for backend and chosen specs to run
        run: echo "Start backend with Spring profile ${{ matrix.spring-profile }} and run specs ${{ matrix.selected-specs }}"
      - name: Checkout ladybug
        uses: actions/checkout@v5
        with:
          repository: wearefrank/ladybug
          path: ladybug
      # No "cache: pnpm" here. It would cache the pnpm store again, also for every branch.
      # Must be the same Node.js version as in job renew-caches.
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      # Caching is explained in the action.
      - name: Install frontend dependencies with pnpm
        uses: ./ladybug/.github/actions/pnpm-install
        with:
          project-dir: ladybug/ladybug-frontend

      - name: Set Cypress environment variables
        run: cp .github/workflows/cypress.env.json.cicd ladybug-frontend/cypress.env.json
        working-directory: ladybug

      - name: Enable ladybug.ui.test.mode
        if: ${{ matrix.authenticationTest == 'only-backend' }}
        working-directory: ladybug
        run: cp .github/workflows/test-auth-only-backend.properties ladybug-test-webapp/src/main/resources/test.properties
      - name: Enable authentication by removing the lines of web.xml that contain CICD_AUTH
        if: ${{ matrix.authenticationTest != 'no-authentication' }}
        working-directory: ladybug/ladybug-test-webapp/src/main/webapp/WEB-INF
        run: sed -i '/CICD_AUTH/d' web.xml

      # Also saves the caches on master. See the action.
      - name: Start ladybug-test-webapp
        uses: ./ladybug/.github/actions/start-ladybug-test-webapp
        with:
          spring-profile: ${{ matrix.spring-profile }}
          authentication: ${{ matrix.authenticationTest != 'no-authentication' }}
      - name: Run cypress with chrome browser
        uses: cypress-io/github-action@v7.4.3
        with:
          working-directory: ladybug/ladybug-frontend
          # Dependencies are installed above. Installing here would also make this action
          # save its own caches for every branch.
          install: false
          spec: ${{ matrix.selected-specs }}
          config: baseUrl=http://localhost:8090/ladybug
          browser: chrome
        env:
          CYPRESS_observerUsername: ${{ matrix.observerUsername }}
          CYPRESS_observerPassword: ${{ matrix.observerPassword }}
          CYPRESS_testerUsername: ${{ matrix.testerUsername }}
          CYPRESS_testerPassword: ${{ matrix.testerPassword }}

      - name: Show which users were actually authenticated, as logged in ladybug.log
        if: always() && matrix.observerUsername != ''
        run: bash ladybug/.github/workflows/show-authenticated-users.sh ladybug/ladybug-test-webapp/data/ladybug.log

      - name: Collect failure data into a single artifact directory
        if: failure()
        run: bash ladybug/.github/workflows/jaxrs/collect-failure-data.sh

      - name: Store logs
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: jaxrs logs and videos ${{ matrix.name }}
          path: artifact-data/
          if-no-files-found: warn

