name: Frank!Runner download cache
description: >
  Restores or saves the cache of frank-runner/download. Frank!Runner must be checked out in
  directory frank-runner of the workspace. Call this action with mode "restore" before Frank!Runner
  runs and with mode "save" after Frank!Runner has downloaded everything it needs (for example
  when the server is up). Mode "save" only saves on master and only if "restore" did not find
  the cache. Mode "restore" passes the key and the cache hit to mode "save" through environment
  variables.

  The key depends on the files of Frank!Runner that define what it downloads. When Frank!Runner
  is updated, a new cache is created from scratch, so that it contains only what the new version
  needs. Caches with an old key are no longer used and GitHub deletes them after 7 days. There
  are no restore-keys, because restoring an old cache would carry old versions of downloads along
  into the new cache.

  Only frank-runner/download is cached, not frank-runner/build. Frank!Runner recreates
  frank-runner/build from frank-runner/download without network access. frank-runner/build also
  holds runtime state (Tomcat logs, deployed webapps) that should not be cached.

  Caches are only saved on master, see ../cache-common.sh. The logic is in cache.sh.
inputs:
  mode:
    description: restore or save
    required: true
runs:
  using: composite
  steps:
    - name: Prepare ${{ inputs.mode }} of Frank!Runner downloads
      id: prepare
      run: bash "${GITHUB_ACTION_PATH}/cache.sh" "${MODE}"
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
    - name: Restore Frank!Runner downloads from cache
      id: restore
      if: ${{ inputs.mode == 'restore' }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.FRANK_RUNNER_DOWNLOAD_CACHE_PATHS }}
        key: ${{ steps.prepare.outputs.key }}
    - name: Remember key and cache hit for saving
      if: ${{ inputs.mode == 'restore' }}
      run: bash "${GITHUB_ACTION_PATH}/cache.sh" remember
      shell: bash
      env:
        CACHE_KEY: ${{ steps.restore.outputs.cache-primary-key }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
    # When multiple matrix jobs try to save the same key, one of them succeeds and the others
    # log a warning.
    - name: Save Frank!Runner downloads to cache
      if: ${{ steps.prepare.outputs.save == 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.FRANK_RUNNER_DOWNLOAD_CACHE_PATHS }}
        key: ${{ env.FRANK_RUNNER_DOWNLOAD_CACHE_KEY }}
