@if (lastReport !== null) {
  <div data-cy-debug-tree="buttons" class="button-row">
    <button data-cy-debug-tree="expandAll" class="btn btn-info" title="Expand All" (click)="expandAll()">
      <i class="fa fa-expand"></i>
    </button>
    <button data-cy-debug-tree="collapseAll" class="btn btn-info" title="Collapse All" (click)="collapseAll()">
      <i class="fa fa-compress"></i>
    </button>
    <button
      data-cy-debug-tree="toggleShowCheckpointId"
      class="btn btn-info"
      (click)="toggleCheckpointAndStorageIdShown()"
      title="Show or hide storage id and checkpoint id"
    >
      <i class="fa fa-key"></i>
    </button>

    <input
      data-cy-debug-tree="search"
      type="text"
      name="search"
      placeholder="&#xF002;"
      (keyup)="changeSearchTerm($event)"
    />
  </div>
}
<!-- Always present, also when there is no report, so that the tree view
     does not miss commands. Without a report it shows nothing. -->
<div class="m-1 mb-5">
  <app-tree-view data-cy-debug-tree="root" [commands]="commands" (nodeSelected)="emitNodeSelected($event)" />
</div>
